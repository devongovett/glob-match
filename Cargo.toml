[package]
name = "glob-match"
description = "An extremely fast glob matcher"
version = "0.2.1"
license = "MIT"
authors = ["Devon Govett <devongovett@gmail.com>"]
edition = "2021"

[dev-dependencies]
codspeed-criterion-compat = "2.6.0"
criterion = "0.4.0"
fast-glob = "0.3.2"
glob = "0.3.1"
globset = "0.4.10"
origin_glob_match = { package = "glob-match", version = "0.2.1" }

[[bench]]
name = "bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = 'abort'
